  <line x1="545" y1="86" x2="532" y2="258" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="385" y1="364" x2="532" y2="258" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="705" y1="364" x2="532" y2="258" stroke="#D946EF" stroke-width="2" stroke-dasharray="5 3"/>

  <circle cx="532" cy="258" r="18" fill="#FBBF24" stroke="#F8FAFC" stroke-width="3"/>
  <circle cx="545" cy="86" r="15" fill="#06B6D4" stroke="#07090E" stroke-width="2.4"/>
  <circle cx="385" cy="364" r="15" fill="#F59E0B" stroke="#07090E" stroke-width="2.4"/>
  <circle cx="705" cy="364" r="15" fill="#D946EF" stroke="#07090E" stroke-width="2.4"/>

  <text x="532" y="334" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="13.5" font-weight="600" fill="#CBD5E1">α + β + γ = 1.0</text>
