    <rect x="0" y="168" width="118" height="24" rx="5" fill="#A855F7" fill-opacity="0.65"/>
  </g>

  <!-- Projection Trajectory Arc -->
  <path d="M266 196 C322 108 386 104 446 138" fill="none" stroke="#FBBF24" stroke-width="2.6" stroke-dasharray="6 4"/>
  <polygon points="440,143 454,132 456,148" fill="#FBBF24"/>

  <!-- Right Planar 60° Simplex with Barycentric Coordinates -->
