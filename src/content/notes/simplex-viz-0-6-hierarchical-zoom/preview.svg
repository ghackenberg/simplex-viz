<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Outer Conformal 1:4 Triangle -->
  <polygon class="sv-edge" points="400,66 218,382 582,382" fill="#06B6D4" fill-opacity="0.08" stroke="#475569" stroke-width="2.2"/>

  <!-- Center Inverted 1:4 Cell -->
  <polygon class="sv-stroke-cyan" points="309,224 491,224 400,382" fill="#06B6D4" fill-opacity="0.18" stroke="#22D3EE" stroke-width="2.6"/>
  <line class="sv-stroke-cyan" x1="400" y1="66" x2="309" y2="224" stroke="#06B6D4" stroke-width="2"/>
  <line class="sv-stroke-cyan" x1="400" y1="66" x2="491" y2="224" stroke="#06B6D4" stroke-width="2"/>

  <!-- Level 2 Nested Subdivision -->
  <polygon class="sv-stroke-fuchsia" points="354.5,224 445.5,224 400,303" fill="#D946EF" fill-opacity="0.22" stroke="#E879F9" stroke-width="2"/>

  <!-- 1-Ring Orientation Stars -->
  <circle class="sv-cutout" cx="400" cy="252" r="10" fill="#22D3EE" stroke="#07090E" stroke-width="2"/>
  <circle class="sv-panel sv-stroke-cyan" cx="309" cy="224" r="10" fill="#F8FAFC" stroke="#06B6D4" stroke-width="2.4"/>
  <circle class="sv-panel sv-stroke-cyan" cx="491" cy="224" r="10" fill="#F8FAFC" stroke="#06B6D4" stroke-width="2.4"/>
  <circle class="sv-panel sv-stroke-cyan" cx="400" cy="382" r="10" fill="#F8FAFC" stroke="#06B6D4" stroke-width="2.4"/>

  <!-- Corner Anchors -->
  <circle class="sv-cutout" cx="400" cy="66" r="14" fill="#06B6D4" stroke="#07090E" stroke-width="2.5"/>
  <circle class="sv-cutout" cx="218" cy="382" r="14" fill="#F59E0B" stroke="#07090E" stroke-width="2.5"/>
  <circle class="sv-cutout" cx="582" cy="382" r="14" fill="#D946EF" stroke="#07090E" stroke-width="2.5"/>

  <!-- Minimal Geometric Ratio Callout -->
  <rect class="sv-panel sv-panel-stroke" x="606" y="196" width="112" height="56" rx="10" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5"/>
  <text class="sv-text-cyan" x="662" y="230" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="18" font-weight="700" fill="#22D3EE">1 : 4</text>
</svg>
