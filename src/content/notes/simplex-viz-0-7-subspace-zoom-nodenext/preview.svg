  <line x1="155" y1="178" x2="545" y2="78" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="198" y1="252" x2="395" y2="365" stroke="#D946EF" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="6 4"/>

