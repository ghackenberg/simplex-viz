  <circle cx="502" cy="264" r="14" fill="#F59E0B" stroke="#07090E" stroke-width="2.4"/>
  <circle cx="588" cy="264" r="15" fill="#D946EF" stroke="#07090E" stroke-width="2.4"/>
  <polygon points="545,228 558,242 545,256 532,242" fill="#22D3EE" stroke="#07090E" stroke-width="2"/>

