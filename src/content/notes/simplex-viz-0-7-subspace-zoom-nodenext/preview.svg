  <circle cx="545" cy="78" r="22" fill="#0B111E" stroke="#06B6D4" stroke-width="2.6"/>
  <text x="545" y="83" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="13" font-weight="700" fill="#F8FAFC">A1</text>
  <circle cx="395" cy="340" r="22" fill="#0B111E" stroke="#F59E0B" stroke-width="2.6"/>
  <text x="395" y="345" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="13" font-weight="700" fill="#F8FAFC">A2</text>
  <circle cx="695" cy="340" r="22" fill="#0B111E" stroke="#D946EF" stroke-width="2.6"/>
  <text x="695" y="345" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="13" font-weight="700" fill="#F8FAFC">A3</text>

