<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Left Macro Lattice with Highlighted Subspace Cell -->
  <g class="sv-edge" stroke="#24324A" stroke-width="1.4" fill="none">
    <polygon points="155,105 70,252 240,252" fill="#06B6D4" fill-opacity="0.06"/>
    <polygon points="70,252 240,252 155,399"/>
    <polygon points="155,105 240,252 325,105"/>
    <polygon points="240,252 325,105 410,252"/>
    <polygon class="sv-stroke-cyan" points="155,178 112,252 198,252" fill="#06B6D4" fill-opacity="0.20" stroke="#22D3EE" stroke-width="2"/>
  </g>

  <!-- Subspace Magnification Projection Cone -->
  <polygon points="198,252 155,178 495,78 495,372" fill="#06B6D4" fill-opacity="0.05"/>
  <line class="sv-stroke-cyan" x1="155" y1="178" x2="545" y2="78" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line class="sv-stroke-fuchsia" x1="198" y1="252" x2="395" y2="365" stroke="#D946EF" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- Right Enlarged Focused Leaf Simplex -->
  <polygon class="sv-stroke-cyan" points="545,78 395,340 695,340" fill="#06B6D4" fill-opacity="0.14" stroke="#22D3EE" stroke-width="2.6"/>
  <polygon class="sv-panel sv-edge" points="545,148 456,304 634,304" fill="#07090E" fill-opacity="0.45" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- Leaf Items Inside Focused Triangle -->
  <circle class="sv-cutout" cx="545" cy="198" r="16" fill="#06B6D4" stroke="#07090E" stroke-width="2.4"/>
  <circle class="sv-cutout" cx="502" cy="264" r="14" fill="#F59E0B" stroke="#07090E" stroke-width="2.4"/>
  <circle class="sv-cutout" cx="588" cy="264" r="15" fill="#D946EF" stroke="#07090E" stroke-width="2.4"/>
  <polygon class="sv-cutout" points="545,228 558,242 545,256 532,242" fill="#22D3EE" stroke="#07090E" stroke-width="2"/>

  <!-- 3 Anchor Collars -->
  <circle class="sv-panel" cx="545" cy="78" r="22" fill="#0B111E" stroke="#06B6D4" stroke-width="2.6"/>
  <text class="sv-ink" x="545" y="83" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="13" font-weight="700" fill="#F8FAFC">A1</text>
  <circle class="sv-panel" cx="395" cy="340" r="22" fill="#0B111E" stroke="#F59E0B" stroke-width="2.6"/>
  <text class="sv-ink" x="395" y="345" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="13" font-weight="700" fill="#F8FAFC">A2</text>
  <circle class="sv-panel" cx="695" cy="340" r="22" fill="#0B111E" stroke="#D946EF" stroke-width="2.6"/>
  <text class="sv-ink" x="695" y="345" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="13" font-weight="700" fill="#F8FAFC">A3</text>

  <!-- Minimal Type-Check Token -->
  <rect class="sv-panel sv-panel-stroke" x="78" y="318" width="166" height="42" rx="8" fill="#0B0F17" stroke="#1E293B" stroke-width="1.4"/>
  <text class="sv-text-cyan" x="161" y="344" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, Noto Sans Symbols, monospace" font-size="12.5" font-weight="600" fill="#22D3EE">ESM · .d.ts OK</text>
