  <line class="sv-edge" x1="244" y1="158" x2="244" y2="196" stroke="#334155" stroke-width="1.8"/>
  <line class="sv-edge" x1="556" y1="158" x2="292" y2="196" stroke="#334155" stroke-width="1.6" stroke-dasharray="4 3"/>

