<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sv-font-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="65%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>
    <radialGradient id="sv-font-glow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sv-font-bg)"/>
  <rect width="800" height="450" fill="url(#sv-font-glow)"/>

  <!-- Stage 1: WOFF2 Font Package -->
  <rect x="64" y="138" width="174" height="174" rx="16" fill="#0B111E" stroke="#06B6D4" stroke-opacity="0.75" stroke-width="2"/>
  <text x="151" y="182" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="14" font-weight="700" fill="#22D3EE">WOFF2</text>
  <text x="151" y="238" text-anchor="middle" font-family="Plus Jakarta Sans, Noto Sans, Noto Sans Symbols, sans-serif" font-size="38" font-weight="700" fill="#F8FAFC">Aa α</text>
  <text x="151" y="278" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, Noto Sans Symbols, monospace" font-size="14" fill="#94A3B8">→  •  60°</text>

  <!-- Arrow 1 -->
  <line x1="238" y1="225" x2="300" y2="225" stroke="#475569" stroke-width="2.5"/>
  <polygon points="294,217 308,225 294,233" fill="#F59E0B"/>

  <!-- Stage 2: Runtime TTF Decompress -->
  <rect x="312" y="138" width="174" height="174" rx="16" fill="#0B111E" stroke="#F59E0B" stroke-opacity="0.75" stroke-width="2"/>
  <text x="399" y="182" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="14" font-weight="700" fill="#FBBF24">TTF</text>
  <rect x="352" y="206" width="94" height="36" rx="8" fill="#F59E0B" fill-opacity="0.16" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="399" y="229" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="13" font-weight="700" fill="#F8FAFC">os.tmpdir</text>
  <text x="399" y="278" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="12.5" fill="#94A3B8">loadSys: false</text>

  <!-- Arrow 2 -->
  <line x1="486" y1="225" x2="548" y2="225" stroke="#475569" stroke-width="2.5"/>
  <polygon points="542,217 556,225 542,233" fill="#D946EF"/>

  <!-- Stage 3: Deterministic Raster Target -->
  <rect x="560" y="138" width="176" height="174" rx="16" fill="#0B111E" stroke="#D946EF" stroke-opacity="0.8" stroke-width="2"/>
  <text x="648" y="182" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="14" font-weight="700" fill="#E879F9">RESVG</text>
  <polygon points="648,200 604,274 692,274" fill="#06B6D4" fill-opacity="0.18" stroke="#22D3EE" stroke-width="2"/>
  <circle cx="648" cy="200" r="6" fill="#06B6D4"/>
  <circle cx="604" cy="274" r="6" fill="#F59E0B"/>
  <circle cx="692" cy="274" r="6" fill="#D946EF"/>
  <text x="648" y="298" text-anchor="middle" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="12" fill="#94A3B8">1200×630 PNG</text>
</svg>
