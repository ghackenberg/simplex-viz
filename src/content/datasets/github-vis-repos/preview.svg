    <text x="102" y="8" text-anchor="end" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="20" font-weight="600" fill="#22D3EE">104k</text>
    <polygon points="116,-8 118.4,-2.4 124.4,-2 119.8,2 121.2,7.8 116,4.6 110.8,7.8 112.2,2 107.6,-2 113.6,-2.4" fill="#22D3EE"/>
