    <rect x="-134" y="-38" width="268" height="76" rx="12" fill="#0C1220" stroke="#D946EF" stroke-width="2.6"/>
    <rect x="-110" y="-11" width="22" height="22" rx="5" fill="#3178C6"/>
    <text x="-74" y="9" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="25" font-weight="700" fill="#F8FAFC">deck.gl</text>
    <text x="94" y="8" text-anchor="end" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="19" font-weight="600" fill="#E879F9">12.6k</text>
