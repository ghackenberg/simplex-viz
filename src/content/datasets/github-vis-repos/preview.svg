    <rect x="-134" y="-38" width="268" height="76" rx="12" fill="#0C1220" stroke="#F59E0B" stroke-width="2.6"/>
    <rect x="-110" y="-11" width="22" height="22" rx="5" fill="#F1E05A"/>
    <text x="-74" y="9" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="25" font-weight="700" fill="#F8FAFC">d3</text>
    <text x="92" y="8" text-anchor="end" font-family="IBM Plex Mono, Noto Sans, monospace" font-size="20" font-weight="600" fill="#FBBF24">109k</text>
    <polygon points="106,-8 108.4,-2.4 114.4,-2 109.8,2 111.2,7.8 106,4.6 100.8,7.8 102.2,2 97.6,-2 103.6,-2.4" fill="#FBBF24"/>
