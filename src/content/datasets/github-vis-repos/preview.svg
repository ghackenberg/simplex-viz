<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ex-github-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="65%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>
    <radialGradient id="ex-github-glow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.17"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ex-github-bg)"/>
  <rect width="800" height="450" fill="url(#ex-github-glow)"/>

  <!-- 60-degree Jaccard Topology Bridges Connecting Repository Tiles -->
  <g fill="none" stroke-width="2" stroke-dasharray="6 5">
    <line x1="400" y1="138" x2="226" y2="298" stroke="#06B6D4" stroke-opacity="0.5"/>
    <line x1="400" y1="138" x2="574" y2="298" stroke="#D946EF" stroke-opacity="0.5"/>
    <line x1="226" y1="298" x2="574" y2="298" stroke="#F59E0B" stroke-opacity="0.45"/>
  </g>

  <!-- Top Center Hero Tile: three.js -->
  <g transform="translate(400, 138)">
    <rect x="-154" y="-48" width="308" height="96" rx="16" fill="none" stroke="#22D3EE" stroke-opacity="0.38" stroke-width="2.2"/>
    <rect x="-144" y="-38" width="288" height="76" rx="12" fill="#0C1220" stroke="#22D3EE" stroke-width="2.8"/>
    <rect x="-120" y="-11" width="22" height="22" rx="5" fill="#F1E05A"/>
