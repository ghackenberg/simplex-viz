<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ex-zoo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="65%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>
    <radialGradient id="ex-zoo-glow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ex-zoo-bg)"/>
  <rect width="800" height="450" fill="url(#ex-zoo-glow)"/>

  <!-- 60-degree Taxonomic Simplex Linking the 3 Exemplar Medallions -->
  <polygon points="400,146 218,308 582,308" fill="#F59E0B" fill-opacity="0.045" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Left Medallion: Cetacean / Dolphin Silhouette -->
  <g transform="translate(218, 286)">
    <circle cx="0" cy="0" r="82" fill="none" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="72" fill="#0B111E" stroke="#22D3EE" stroke-width="3"/>
    <circle cx="0" cy="0" r="65" fill="#06B6D4" fill-opacity="0.14"/>
    <g transform="scale(5.2)">
      <path d="M -7.4 4.2 Q -5.2 -5.4 1.6 -4.6 L 2.8 -7.2 L 3.6 -4.0 Q 7.2 -2.2 7.8 1.2 L 5.2 1.2 Q 2.4 -1.4 -1.6 0.6 Q -4.2 2.0 -5.0 5.4 L -7.6 6.8 L -6.2 4.4 Z" fill="#22D3EE" fill-opacity="0.94"/>
      <circle cx="4.8" cy="-0.8" r="0.7" fill="#0B111E"/>
    </g>
  </g>

  <!-- Right Medallion: Soaring Raptor Silhouette -->
  <g transform="translate(582, 286)">
    <circle cx="0" cy="0" r="82" fill="none" stroke="#D946EF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="72" fill="#0B111E" stroke="#E879F9" stroke-width="3"/>
    <circle cx="0" cy="0" r="65" fill="#D946EF" fill-opacity="0.14"/>
    <g transform="scale(5.2)">
      <path d="M 0 -5.6 L 1.6 -3.2 L 8.2 -5.4 L 6.6 0.4 L 2.2 1.2 L 3.2 6.4 L 0 4.8 L -3.2 6.4 L -2.2 1.2 L -6.6 0.4 L -8.2 -5.4 L -1.6 -3.2 Z" fill="#E879F9" fill-opacity="0.94"/>
    </g>
  </g>

  <!-- Center Hero Medallion: Feline Carnivore Exemplar -->
  <g transform="translate(400, 178)">
    <circle cx="0" cy="0" r="98" fill="none" stroke="#FBBF24" stroke-opacity="0.48" stroke-width="2.4" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="84" fill="#0B111E" stroke="#FBBF24" stroke-width="3.2"/>
    <circle cx="0" cy="0" r="76" fill="#F59E0B" fill-opacity="0.16"/>
    <g transform="scale(6.0)">
      <path d="M -6.2 -7.2 L -3.1 -3.6 Q 0 -4.3 3.1 -3.6 L 6.2 -7.2 L 6.8 -1.2 Q 7.2 3.8 3.6 6.2 Q 0 7.8 -3.6 6.2 Q -7.2 3.8 -6.8 -1.2 Z" fill="#FBBF24" fill-opacity="0.95"/>
      <circle cx="-2.5" cy="-0.3" r="1.05" fill="#0B111E"/>
      <circle cx="2.5" cy="-0.3" r="1.05" fill="#0B111E"/>
      <path d="M -1.3 2.6 L 1.3 2.6 L 0 4.2 Z" fill="#0B111E"/>
    </g>
  </g>
</svg>
