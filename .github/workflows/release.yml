name: Release Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      should_publish: ${{ steps.npm_state.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify synchronized workspace version
        id: version
        run: |
          VERSION="$(node -e '
            const fs = require("node:fs");
            const pkgs = ["packages/core/package.json", "packages/svg/package.json", "packages/canvas/package.json", "packages/react/package.json", "packages/wc/package.json"];
            const versions = pkgs.map((p) => JSON.parse(fs.readFileSync(p, "utf8")).version);
            if (new Set(versions).size !== 1) {
              console.error("Workspace package versions do not match:", versions);
              process.exit(1);
            }
            process.stdout.write(versions[0]);
          ')"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check npm publishing configuration
        id: npm_config
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_NPM_TOKEN" = "true" ] || [ "${{ vars.NPM_TRUSTED_PUBLISHING }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release skipped: configure NPM_TOKEN secret or npm Trusted Publishing (NPM_TRUSTED_PUBLISHING=true) so npmjs.org and GitHub Releases stay 1:1 synchronized."
          fi

      - name: Check whether current version is unpublished on npmjs.org
        id: npm_state
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "${{ steps.npm_config.outputs.enabled }}" != "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UNPUBLISHED="false"
          for pkg in @simplex-viz/core @simplex-viz/svg @simplex-viz/canvas @simplex-viz/react @simplex-viz/wc; do
            if ! npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              UNPUBLISHED="true"
              break
            fi
          done
          echo "should_publish=${UNPUBLISHED}" >> "$GITHUB_OUTPUT"
          if [ "$UNPUBLISHED" = "false" ]; then
            echo "All workspace packages at v${VERSION} are already published on npmjs.org; skipping release."
          fi

  quality:
    needs: precheck
    if: needs.precheck.result == 'success' && needs.precheck.outputs.should_publish == 'true'
    uses: ./.github/workflows/_quality.yml
    permissions:
      contents: read

  publish:
    needs: [precheck, quality]
    if: needs.precheck.result == 'success' && needs.precheck.outputs.should_publish == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Upgrade npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm packages and validate exports
        run: pnpm build:packages && pnpm validate:packages

      - name: Publish packages to npmjs.org
        env:
          VERSION: ${{ needs.precheck.outputs.version }}
          USE_OIDC_FIRST: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          if [ "$USE_OIDC_FIRST" != "true" ] && [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          for dir in packages/core packages/svg packages/canvas packages/react packages/wc; do
            NAME="$(node -p "require('./${dir}/package.json').name")"
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} is already published on npmjs.org; skipping."
            elif [ "$USE_OIDC_FIRST" = "true" ]; then
              if pnpm --filter "$NAME" publish --access public --no-git-checks; then
                continue
              fi
              if [ -z "$NPM_TOKEN" ]; then
                exit 1
              fi
              echo "OIDC publish failed for ${NAME}@${VERSION}; retrying with NPM_TOKEN fallback..."
              npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
              STATUS=0
              pnpm --filter "$NAME" publish --access public --no-git-checks || STATUS=$?
              npm config delete //registry.npmjs.org/:_authToken || true
              if [ "$STATUS" -ne 0 ]; then
                exit "$STATUS"
              fi
            else
              pnpm --filter "$NAME" publish --access public --no-git-checks
            fi
          done

      - name: Create GitHub Release for published commit
        if: success()
        env:
          VERSION: ${{ needs.precheck.outputs.version }}
          TAG: ${{ needs.precheck.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; skipping."
            exit 0
          fi

          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            let notes = "";

            if (fs.existsSync("CHANGELOG.md")) {
              const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
              const startIdx = lines.findIndex((l) => l.startsWith(`## [${version}]`));
              if (startIdx !== -1) {
                let endIdx = lines.length;
                for (let i = startIdx + 1; i < lines.length; i++) {
                  if (/^## \[/.test(lines[i])) {
                    endIdx = i;
                    break;
                  }
                }
                notes = lines.slice(startIdx + 1, endIdx).join("\n").trim();
              }
            }

            if (!notes && fs.existsSync("packages/core/CHANGELOG.md")) {
              const pkgLines = fs.readFileSync("packages/core/CHANGELOG.md", "utf8").split(/\r?\n/);
              const startIdx = pkgLines.findIndex((l) => l.trim() === `## ${version}`);
              if (startIdx !== -1) {
                let endIdx = pkgLines.length;
                for (let i = startIdx + 1; i < pkgLines.length; i++) {
                  if (/^##\s+/.test(pkgLines[i])) {
                    endIdx = i;
                    break;
                  }
                }
                notes = pkgLines.slice(startIdx + 1, endIdx).join("\n").trim();
              }
            }

            if (notes) {
              fs.writeFileSync("/tmp/release-notes.md", notes + "\n", "utf8");
            }
          ' "$VERSION"

          TARGET_ARGS=()
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TARGET_ARGS=(--target "$GITHUB_SHA")
          fi

          if [ -s /tmp/release-notes.md ]; then
            gh release create "$TAG" \
              "${TARGET_ARGS[@]}" \
              --title "SimplexViz ${TAG}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              "${TARGET_ARGS[@]}" \
              --title "SimplexViz ${TAG}" \
              --generate-notes
          fi
