name: Quality Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and module boundaries
        run: pnpm lint:eslint

      - name: Typecheck all packages, app, and scripts
        run: pnpm typecheck

      - name: Verify synchronized brand assets
        run: pnpm sync:brand:check

      - name: Build npm packages and validate exports
        run: pnpm build:packages && pnpm validate:packages

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build demo application
        run: pnpm build:demo
