    <text x="52" y="98"><tspan fill="#6D28D9">from</tspan> <tspan fill="#4338CA" font-weight="700">'@simplex-viz/canvas'</tspan><tspan fill="#475569">;</tspan></text>
    <text x="38" y="122"><tspan fill="#6D28D9">const</tspan> <tspan fill="#0F172A">atlas</tspan> <tspan fill="#475569">=</tspan> <tspan fill="#0369A1">createSimplexCanvas</tspan><tspan fill="#475569">(</tspan><tspan fill="#B45309">'#stage'</tspan><tspan fill="#475569">, {</tspan></text>
    <text x="52" y="140"><tspan fill="#0369A1">items</tspan><tspan fill="#475569">:</tspan> <tspan fill="#334155">corpus10k,</tspan></text>
    <text x="52" y="158"><tspan fill="#0369A1">preset</tspan><tspan fill="#475569">:</tspan> <tspan fill="#B45309">'badges'</tspan><tspan fill="#475569">,</tspan> <tspan fill="#0369A1">theme</tspan><tspan fill="#475569">:</tspan> <tspan fill="#B45309">'dark'</tspan><tspan fill="#475569">,</tspan></text>
    <text x="52" y="176"><tspan fill="#0369A1">lodThresholdPx</tspan><tspan fill="#475569">:</tspan> <tspan fill="#047857">3.5</tspan><tspan fill="#475569">,</tspan></text>
    <text x="52" y="194"><tspan fill="#0369A1">cullMarginPx</tspan><tspan fill="#475569">:</tspan> <tspan fill="#047857">48</tspan><tspan fill="#475569">,</tspan></text>
    <text x="52" y="212"><tspan fill="#0369A1">maxDevicePixelRatio</tspan><tspan fill="#475569">:</tspan> <tspan fill="#047857">2</tspan><tspan fill="#475569">,</tspan></text>
    <text x="38" y="230"><tspan fill="#475569">});</tspan></text>
    <text x="38" y="252"><tspan fill="#6D28D9">const</tspan> <tspan fill="#0F172A">png</tspan> <tspan fill="#475569">=</tspan> <tspan fill="#6D28D9">await</tspan> <tspan fill="#0F172A">atlas</tspan><tspan fill="#475569">.</tspan><tspan fill="#0369A1">exportPng</tspan><tspan fill="#475569">({ scale: </tspan><tspan fill="#047857">2</tspan><tspan fill="#475569"> });</tspan></text>
  </g>

