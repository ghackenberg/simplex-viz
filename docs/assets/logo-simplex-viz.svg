<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 508 160" width="508" height="160">
  <defs>
    <radialGradient id="svCyan" cx="50%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="svAmber" cx="20%" cy="78%" r="70%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="svMagenta" cx="80%" cy="78%" r="70%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="svEdgeTopLeft" gradientUnits="userSpaceOnUse" x1="256" y1="95" x2="70" y2="417.2">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="svEdgeTopRight" gradientUnits="userSpaceOnUse" x1="256" y1="95" x2="442" y2="417.2">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="svEdgeBottom" gradientUnits="userSpaceOnUse" x1="70" y1="417.2" x2="442" y2="417.2">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Freestanding Maximized 60-degree Simplex Mark -->
  <g transform="translate(16, 16) scale(0.25)">
    <polygon points="256,95 70,417.2 442,417.2" fill="#64748B" fill-opacity="0.08"/>
    <polygon points="256,95 70,417.2 442,417.2" fill="url(#svCyan)"/>
    <polygon points="256,95 70,417.2 442,417.2" fill="url(#svAmber)"/>
    <polygon points="256,95 70,417.2 442,417.2" fill="url(#svMagenta)"/>
    <line x1="256" y1="95" x2="70" y2="417.2" stroke="url(#svEdgeTopLeft)" stroke-width="28" stroke-linecap="round"/>
    <line x1="256" y1="95" x2="442" y2="417.2" stroke="url(#svEdgeTopRight)" stroke-width="28" stroke-linecap="round"/>
    <line x1="70" y1="417.2" x2="442" y2="417.2" stroke="url(#svEdgeBottom)" stroke-width="28" stroke-linecap="round"/>

    <!-- 3 Topic Vertex Nodes -->
    <circle cx="256" cy="95" r="54" fill="#155E75"/>
    <circle cx="256" cy="95" r="37" fill="#06B6D4"/>

    <circle cx="70" cy="417.2" r="54" fill="#92400E"/>
    <circle cx="70" cy="417.2" r="37" fill="#F59E0B"/>

    <circle cx="442" cy="417.2" r="54" fill="#86198F"/>
    <circle cx="442" cy="417.2" r="37" fill="#D946EF"/>
  </g>

  <!-- Dual-Contrast Wordmark synced to top vertex Cyan -->
  <text x="166" y="76" font-family="Noto Sans, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">
    <tspan fill="#6B7F99">Simplex</tspan><tspan fill="#06B6D4">Viz</tspan>
  </text>

  <!-- Subtitle -->
  <text x="168" y="114" font-family="JetBrains Mono, monospace" font-size="13.5" font-weight="600" letter-spacing="1" fill="#64748B">
    60° TRIANGULATION CONTENT ATLAS
  </text>
</svg>
